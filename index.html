<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenic Mechanisms</title>
  <style>
    :root { color-scheme: dark; background: #151b1e; color: #f2e9db;
      font-family: system-ui, sans-serif; }
    body { max-width: 92rem; margin: auto; padding: clamp(1rem, 4vw, 4rem); }
    h1 { font: normal clamp(2.2rem, 5vw, 4.3rem)/1.1 Georgia, serif;
      margin: 0 0 .8em; }
    .gallery { display: grid; grid-template-columns:
      repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); gap: 1.4rem; }
    figure { margin: 0; background: #20292d; border: 1px solid #405055;
      border-radius: .45rem; overflow: hidden; }
    figure a { display: grid; place-items: center; aspect-ratio: 7 / 3;
      background: #101618; }
    figure a:focus-visible { outline: 3px solid #e1ae72; outline-offset: -3px; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    figcaption { padding: .85rem 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Scenic Mechanisms</h1>
    <div class="gallery">
      <figure>
        <a href="stage-mechanisms/stage-preview.png"><img src="stage-mechanisms/stage-preview.png" alt="Stage mechanisms Blender render"></a>
        <figcaption>Stage mechanisms</figcaption>
      </figure>
      <figure>
        <a href="stage-mechanisms/stage2-preview.png"><img src="stage-mechanisms/stage2-preview.png" alt="Stage mechanisms II Blender render"></a>
        <figcaption>Stage mechanisms II</figcaption>
      </figure>
      <figure>
        <a href="stage-mechanisms/stage3-preview.png"><img src="stage-mechanisms/stage3-preview.png" alt="Stage mechanisms III Blender render"></a>
        <figcaption>Stage mechanisms III</figcaption>
      </figure>
      <figure>
        <a href="cam-stage/cam-stage-preview.png"><img src="cam-stage/cam-stage-preview.png" alt="Cam-driven reveal Blender render"></a>
        <figcaption>Cam-driven reveal</figcaption>
      </figure>
      <figure>
        <a href="folding-stage/folding-stage-preview.png"><img src="folding-stage/folding-stage-preview.png" alt="Folding scenic wall Blender render"></a>
        <figcaption>Folding scenic wall</figcaption>
      </figure>
      <figure>
        <a href="scenic-rack/scenic-rack-preview.png"><img src="scenic-rack/scenic-rack-preview.png" alt="Intermittent scenic rack Blender render"></a>
        <figcaption>Intermittent scenic rack</figcaption>
      </figure>
      <figure>
        <a href="hoberman-ring/hoberman-ring-preview.png"><img src="hoberman-ring/hoberman-ring-preview.png" alt="Hoberman ring Blender render"></a>
        <figcaption>Hoberman ring</figcaption>
      </figure>
      <figure>
        <a href="geneva-turntable/geneva-turntable-preview.png"><img src="geneva-turntable/geneva-turntable-preview.png" alt="Geneva turntable Blender render"></a>
        <figcaption>Geneva turntable</figcaption>
      </figure>
      <figure>
        <a href="iris-shutter/iris-preview.png"><img src="iris-shutter/iris-preview.png" alt="Iris shutter Blender render"></a>
        <figcaption>Iris shutter</figcaption>
      </figure>
      <figure>
        <a href="parallel-motion-lantern/parallel-motion-lantern-preview.png"><img src="parallel-motion-lantern/parallel-motion-lantern-preview.png" alt="Parallel-motion lantern Blender render"></a>
        <figcaption>Parallel-motion lantern</figcaption>
      </figure>
      <figure>
        <a href="walking-beam/walking-beam-preview.png"><img src="walking-beam/walking-beam-preview.png" alt="Walking beam Blender render"></a>
        <figcaption>Walking beam</figcaption>
      </figure>
      <figure>
        <a href="wing-shuttle/wing-shuttle-preview.png"><img src="wing-shuttle/wing-shuttle-preview.png" alt="Wing shuttle Blender render"></a>
        <figcaption>Wing shuttle</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
