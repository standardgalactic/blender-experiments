<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>blender-experiments · render gallery</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#14171b;color:#e8ebee}
*{box-sizing:border-box}body{margin:0 auto;max-width:1400px;padding:28px}h1{font-size:1.65rem;margin:0 0 4px}p{color:#aeb7c1}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}input,select{background:#22272e;color:inherit;border:1px solid #47515e;border-radius:6px;padding:9px 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{border:1px solid #343d46;background:#1b2026;border-radius:9px;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#111;cursor:zoom-in}.detail{padding:12px 14px}.heading{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#aeb7c1;font-size:.9rem}
a{color:#a7cdfb}a:hover{color:white}.status{font-size:.8rem;font-weight:600}.pass{color:#8fdaab}.fail{color:#f4a3a3}.unknown{color:#e0c58b}
.links{display:flex;gap:14px;margin-top:8px}dialog{max-width:min(94vw,1100px);max-height:94vh;background:#171b20;color:inherit;border:1px solid #58616b;border-radius:8px;padding:14px}
dialog img{max-width:100%;max-height:75vh;display:block;margin:auto}dialog::backdrop{background:#000c}button{background:#303842;color:inherit;border:1px solid #57616b;border-radius:5px;padding:6px 12px;cursor:pointer}
</style></head><body>
<h1>blender-experiments</h1><p>Offline render gallery · structural results are separate from visual inspection</p>
<div class="controls"><input id="query" type="search" placeholder="Filter task or model"><select id="status"><option value="all">All results</option><option value="pass">Passed</option><option value="fail">Failed</option><option value="unknown">Not evaluated</option></select><span id="count" class="muted"></span></div>
<main class="grid" id="grid"></main><dialog id="lightbox"><button id="close" type="button">Close</button><p id="caption"></p><img id="large" alt="Selected Blender render"></dialog>
<script>
const data=[{"model": "baseline", "task": "001", "passed": true, "checks": [{"object": "Base", "pass": true, "reason": ""}, {"object": "Column", "pass": true, "reason": ""}, {"object": "Cap", "pass": true, "reason": ""}], "image": "results/baseline/001/render.png", "scene": "results/baseline/001/scene.blend", "log": "results/baseline/001/execution.log"}, {"model": "gpt6_pilot", "task": "007", "passed": true, "checks": [{"object": "radial", "pass": true, "reason": ""}], "image": "results/gpt6_pilot/007/render.png", "scene": "results/gpt6_pilot/007/scene.blend", "log": "results/gpt6_pilot/007/execution.log"}, {"model": "gpt6_pilot", "task": "009", "passed": true, "checks": [{"object": "boolean", "pass": true, "reason": ""}], "image": "results/gpt6_pilot/009/render.png", "scene": "results/gpt6_pilot/009/scene.blend", "log": "results/gpt6_pilot/009/execution.log"}, {"model": "negative_control", "task": "007", "passed": false, "checks": [{"object": "radial", "pass": false, "reason": "geometry constraint failed"}], "image": "results/negative_control/007/render.png", "scene": "results/negative_control/007/scene.blend", "log": "results/negative_control/007/execution.log"}, {"model": "negative_control", "task": "009", "passed": false, "checks": [{"object": "boolean", "pass": false, "reason": "geometry constraint failed"}], "image": "results/negative_control/009/render.png", "scene": "results/negative_control/009/scene.blend", "log": "results/negative_control/009/execution.log"}, {"model": "negative_control", "task": "010", "passed": false, "checks": [{"object": "helix", "pass": false, "reason": "geometry constraint failed"}], "image": "results/negative_control/010/render.png", "scene": "results/negative_control/010/scene.blend", "log": "results/negative_control/010/execution.log"}, {"model": "ollama_granite4.1_3b_guided", "task": "001", "passed": false, "checks": [{"object": "Base", "pass": false, "reason": "missing"}, {"object": "Column", "pass": false, "reason": "missing"}  "Step_03", "pass": true, "reason": ""}, {"object": "Step_04", "pass": true, "reason": ""}], "image": "results/reference/004/render.png", "scene": "results/reference/004/scene.blend", "log": "results/reference/004/execution.log"}, {"model": "reference", "task": "005", "passed": true, "checks": [{"object": "Support_L", "pass": true, "reason": ""}, {"object": "Support_R", "pass": true, "reason": ""}, {"object": "Crossbar", "pass": true, "reason": ""}], "image": "results/reference/005/render.png", "scene": "results/reference/005/scene.blend", "log": "results/reference/005/execution.log"}, {"model": "reference", "task": "006", "passed": true, "checks": [{"object": "Tier_00", "pass": true, "reason": ""}, {"object": "Tier_01", "pass": true, "reason": ""}, {"object": "Tier_02", "pass": true, "reason": ""}, {"object": "Tier_03", "pass": true, "reason": ""}], "image": "results/reference/006/render.png", "scene": "results/reference/006/scene.blend", "log": "results/reference/006/execution.log"}, {"model": "reference", "task": "007", "passed": true, "checks": [{"object": "radial", "pass": true, "reason": ""}], "image": "results/reference/007/render.png", "scene": "results/reference/007/scene.blend", "log": "results/reference/007/execution.log"}, {"model": "reference", "task": "008", "passed": true, "checks": [{"object": "arch", "pass": true, "reason": ""}], "image": "results/reference/008/render.png", "scene": "results/reference/008/scene.blend", "log": "results/reference/008/execution.log"}, {"model": "reference", "task": "009", "passed": true, "checks": [{"object": "boolean", "pass": true, "reason": ""}], "image": "results/reference/009/render.png", "scene": "results/reference/009/scene.blend", "log": "results/reference/009/execution.log"}, {"model": "reference", "task": "010", "passed": true, "checks": [{"object": "helix", "pass": true, "reason": ""}], "image": "results/reference/010/render.png", "scene": "results/reference/010/scene.blend", "log": "results/reference/010/execution.log"}, {"model": "reference", "task": "011", "passed": true, "checks": [{"object": "Anchor", "pass": true, "reason": ""}, {"object": "Bridge", "pass": true, "reason": ""}, {"object": "Terminal", "pass": true, "reason": ""}, {"object": "Anchor preservation", "pass": true, "reason": ""}], "image": "results/reference/011/render.png", "scene": "results/reference/011/scene.blend", "log": "results/reference/011/execution.log"}, {"model": "reference", "task": "012", "passed": true, "checks": [{"object": "LeftSupport", "pass": true, "reason": ""}, {"object": "RightSupport", "pass": true, "reason": ""}, {"object": "LeftSupport preservation", "pass": true, "reason": ""}], "image": "results/reference/012/render.png", "scene": "results/reference/012/scene.blend", "log": "results/reference/012/execution.log"}, {"model": "reference", "task": "013", "passed": true, "checks": [{"object": "Step_00", "pass": true, "reason": ""}, {"object": "Step_01", "pass": true, "reason": ""}, {"object": "Step_02", "pass": true, "reason": ""}, {"object": "Step_03", "pass": true, "reason": ""}, {"object": "Step_04", "pass": true, "reason": ""}, {"object": "Step_00 preservation", "pass": true, "reason": ""}, {"object": "Step_01 preservation", "pass": true, "reason": ""}, {"object": "Step_03 preservation", "pass": true, "reason": ""}, {"object": "Step_04 preservation", "pass": true, "reason": ""}], "image": "results/reference/013/render.png", "scene": "results/reference/013/scene.blend", "log": "results/reference/013/execution.log"}, {"model": "smoke_test", "task": "001", "passed": true, "checks": [{"object": "Base", "pass": true, "reason": ""}, {"object": "Column", "pass": true, "reason": ""}, {"object": "Cap", "pass": true, "reason": ""}], "image": "results/smoke_test/001/render.png", "scene": "results/smoke_test/001/scene.blend", "log": "results/smoke_test/001/execution.log"}];
const grid=document.querySelector('#grid'),query=document.querySelector('#query'),status=document.querySelector('#status'),count=document.querySelector('#count');
const dialog=document.querySelector('#lightbox');
function state(x){return x.passed===true?'pass':x.passed===false?'fail':'unknown'}
function render(){const q=query.value.toLowerCase();const rows=data.filter(x=>(x.model+' '+x.task).toLowerCase().includes(q)&&(status.value==='all'||state(x)===status.value));
count.textContent=rows.length+' / '+data.length+' renders';grid.replaceChildren();
for(const x of rows){const card=document.createElement('article');card.className='card';const im=document.createElement('img');im.src=x.image;im.alt='Render for '+x.task+' by '+x.model;im.loading='lazy';im.onclick=()=>{document.querySelector('#large').src=x.image;document.querySelector('#caption').textContent=x.model+' / '+x.task;dialog.showModal()};card.append(im);
const detail=document.createElement('div');detail.className='detail';const head=document.createElement('div');head.className='heading';const title=document.createElement('strong');title.textContent=x.task+' · '+x.model;const badge=document.createElement('span');badge.className='status '+state(x);badge.textContent=state(x).toUpperCase();head.append(title,badge);detail.append(head);
const checks=document.createElement('div');checks.className='muted';checks.textContent=x.checks.length?x.checks.filter(c=>c.pass).length+'/'+x.checks.length+' structural checks':'No metrics';detail.append(checks);
const links=document.createElement('div');links.className='links';for(const [label,path] of [['PNG',x.image],['Blend',x.scene],['Log',x.log]]){const a=document.createElement('a');a.href=path;a.textContent=label;links.append(a)}detail.append(links);card.append(detail);grid.append(card)}}
query.addEventListener('input',render);status.addEventListener('change',render);document.querySelector('#close').onclick=()=>dialog.close();render();
</script></body></html>
